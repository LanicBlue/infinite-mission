<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>im · InfiniteMission</title>
<style>
/* PSE-style design tokens: constant dark sidebar, adaptive content area. */
:root {
	color-scheme: light dark;
	--bg: #f4f5f7;
	--bg-elevated: #ffffff;
	--sidebar: #1f2430;
	--sidebar-fg: #c9d1dc;
	--sidebar-fg-active: #ffffff;
	--sidebar-accent: #4c8dff;
	--ink: #1a1f2e;
	--ink-muted: #5b6577;
	--ink-faint: #8a93a6;
	--border: #dfe3ea;
	--border-strong: #c7cdd8;
	--accent: #2b5fff;
	--accent-soft: #eaf0ff;
	--ok: #1f9d55;
	--warn: #b07d00;
	--err: #d4433a;
	--radius: 10px;
	--radius-sm: 6px;
	--shadow: 0 1px 2px rgba(20,30,50,.04), 0 4px 16px rgba(20,30,50,.06);
	font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
	font-size: 14px;
	line-height: 1.5;
}
@media (prefers-color-scheme: dark) {
	:root {
		--bg: #14171c;
		--bg-elevated: #1c2129;
		--sidebar: #0f1218;
		--ink: #e6e9ef;
		--ink-muted: #9aa3b2;
		--ink-faint: #6b7384;
		--border: #2a313c;
		--border-strong: #3a424f;
		--accent-soft: #1a2840;
		--shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
	}
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); }
code, .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
button { font: inherit; cursor: pointer; }
input, select { font: inherit; color: var(--ink); background: var(--bg-elevated); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 4px 8px; }
input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }

.shell { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }

/* ---- sidebar ---- */
.sidebar { background: var(--sidebar); color: var(--sidebar-fg); padding: 20px 12px; display: flex; flex-direction: column; gap: 16px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand h1 { margin: 0; font-size: 20px; color: var(--sidebar-fg-active); letter-spacing: .5px; }
.brand .sub { margin: 2px 0 0; font-size: 12px; color: var(--ink-faint); }
.brand .ws { margin: 6px 0 0; font-size: 11px; color: var(--ink-faint); word-break: break-all; }
.nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.nav-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-faint); padding: 8px 10px 4px; }
.nav-item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: none; border-radius: var(--radius-sm); color: var(--sidebar-fg); padding: 7px 10px; }
.nav-item:hover { background: rgba(255,255,255,.06); }
.nav-item.active { background: rgba(76,141,255,.18); color: var(--sidebar-fg-active); }
.nav-item .count { margin-left: auto; font-size: 11px; background: var(--sidebar-accent); color: #fff; border-radius: 99px; padding: 0 7px; min-width: 18px; text-align: center; }
.nav-item .count.soft { background: rgba(255,255,255,.14); }
.nav-item.muted-item { color: var(--ink-faint); }
.nav-add { color: var(--sidebar-accent); }
.nav-foot { display: flex; flex-direction: column; gap: 2px; border-top: 1px solid rgba(255,255,255,.08); padding-top: 10px; }

/* ---- detail area ---- */
.main { padding: 24px 28px 48px; max-width: 1080px; width: 100%; }
.detail-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
.detail-header h2 { margin: 0; font-size: 22px; }
.meta { color: var(--ink-muted); font-size: 12.5px; margin-top: 3px; }
.header-actions { display: flex; align-items: center; gap: 10px; }
.tabs { display: inline-flex; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 3px; gap: 2px; }
.tab { border: none; background: none; border-radius: 4px; padding: 5px 14px; color: var(--ink-muted); }
.tab.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

.btn { border: 1px solid var(--border-strong); background: var(--bg-elevated); border-radius: var(--radius-sm); padding: 5px 12px; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { opacity: .9; }
.btn.danger { color: var(--err); border-color: color-mix(in srgb, var(--err) 40%, var(--border)); background: transparent; }
.btn.danger:hover { border-color: var(--err); }
.btn.small { padding: 2px 9px; font-size: 12.5px; }
.btn.outcome { border-color: var(--accent); color: var(--accent); }
.btn.outcome:hover { background: var(--accent); color: #fff; }

.card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; margin-bottom: 12px; }
.card h3 { margin: 0 0 2px; font-size: 15px; }
.card .objective { color: var(--ink-muted); margin: 4px 0 10px; font-size: 13px; }
.card-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; border-radius: 99px; padding: 1px 9px; border: 1px solid var(--border); color: var(--ink-muted); background: var(--bg); }
.chip.accent { border-color: transparent; background: var(--accent-soft); color: var(--accent); }
.chip.ok { border-color: transparent; background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
.chip.user { border-color: transparent; background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }

.reason { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 8px 12px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; margin: 8px 0; font-size: 13px; }
.reason .k { color: var(--ink-faint); font-size: 11px; display: block; }

table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; color: var(--ink-faint); font-weight: 500; font-size: 12px; padding: 6px 10px; border-bottom: 1px solid var(--border); }
td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: none; }

.timeline { list-style: none; margin: 10px 0 0; padding: 0 0 0 14px; border-left: 2px solid var(--border); }
.timeline li { position: relative; padding: 2px 0 10px; font-size: 12.5px; color: var(--ink-muted); }
.timeline li::before { content: ""; position: absolute; left: -19px; top: 7px; width: 8px; height: 8px; border-radius: 99px; background: var(--bg-elevated); border: 2px solid var(--ink-faint); }
.timeline li.routed::before { border-color: var(--accent); }
.timeline li.ended::before { border-color: var(--ok); background: var(--ok); }
.timeline .t { color: var(--ink-faint); font-size: 11px; margin-right: 6px; }

details.form { margin-bottom: 12px; }
details.form summary { cursor: pointer; color: var(--accent); font-size: 13px; padding: 4px 0; user-select: none; }
.form-grid { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px 2px 2px; }
.form-grid label { font-size: 12px; color: var(--ink-muted); display: flex; gap: 5px; align-items: center; }

.empty { color: var(--ink-faint); text-align: center; padding: 40px 0; font-size: 13px; }
.hint { color: var(--ink-faint); font-size: 12px; }
.spacer { flex: 1; }

#toast { position: fixed; right: 18px; bottom: 18px; max-width: 420px; display: flex; flex-direction: column; gap: 8px; z-index: 10; }
.toast { background: var(--bg-elevated); border: 1px solid var(--border); border-left: 3px solid var(--ok); border-radius: var(--radius-sm); box-shadow: var(--shadow); padding: 9px 14px; font-size: 13px; animation: slide .18s ease-out; }
.toast.err { border-left-color: var(--err); }
@keyframes slide { from { transform: translateY(8px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
</style>
</head>
<body>
<div class="shell">
	<aside class="sidebar">
		<div class="brand">
			<h1>im</h1>
			<p class="sub">InfiniteMission</p>
			<p class="ws mono" id="ws-path"></p>
		</div>
		<nav class="nav" id="nav" aria-label="主导航"></nav>
		<div class="nav-foot" id="nav-foot"></div>
	</aside>
	<main class="main" id="main"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const $ = (sel, root) => (root || document).querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ago = ts => {
	if (!ts) return "—";
	const m = Math.floor((Date.now()/1000 - ts) / 60);
	if (m < 1) return "刚刚";
	if (m < 60) return m + " 分钟前";
	if (m < 1440) return Math.floor(m/60) + " 小时前";
	return Math.floor(m/1440) + " 天前";
};

let state = null, lastRaw = "";
let pane = "inbox";        // inbox | works | missions | members | settings
let expanded = new Set();  // expanded mission ids

function toast(msg, ok) {
	const box = $("#toast");
	const el = document.createElement("div");
	el.className = "toast" + (ok ? "" : " err");
	el.textContent = msg;
	box.appendChild(el);
	setTimeout(() => el.remove(), ok ? 3500 : 6500);
}

async function act(action) {
	try {
		const res = await fetch("/api/action", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(action) });
		const data = await res.json();
		if (data.ok) { toast(data.message || "done", true); refresh(true); }
		else toast(data.error || "action failed", false);
	} catch (e) { toast(String(e), false); }
}

/* ---------------- state derivation ---------------- */
const liveWorks = () => (state.works || []).filter(w => w.lifecycle !== "retired");
const eventsOf = mid => (state.events || []).filter(e => e.mission_id === mid).sort((a,b) => a.seq - b.seq);

function eventSummary(ev) {
	let p = {}; try { p = JSON.parse(ev.payload); } catch {}
	switch (ev.type) {
		case "mission.created": return `mission 创建 · entry ${p.entry}`;
		case "mission.round.completed": return `${p.workKey} 交卷 ${p.outcome}` + (p.feedback ? ` ·「${p.feedback}」` : "") + (Array.isArray(p.documentReceipts) && p.documentReceipts.length ? ` · ${p.documentReceipts.length} 回执` : "");
		case "mission.routed": return `${p.from} → ${p.to}（iteration ${p.iteration}）`;
		case "mission.ended": return `mission 终结 · ${p.disposition} / ${p.outcome}`;
		default: return ev.type;
	}
}

/* ---------------- rendering ---------------- */
function renderSidebar() {
	const nav = $("#nav");
	const inboxN = (state.inbox || []).length;
	const activeN = (state.missions || []).filter(m => m.status === "active").length;
	nav.innerHTML = `<div class="nav-label">任务面</div>` + [
		["inbox", "📥 收件箱", inboxN, "用户工位待办"],
		["works", "🛠 工位", 0, ""],
		["missions", "📋 任务", activeN, "在途任务"],
	].map(([id, label, n, title]) =>
		`<button class="nav-item${pane===id ? " active" : ""}" data-nav="${id}">${label}${n ? `<span class="count"${title?` title="${title}"`:""}>${n}</span>` : ""}</button>`
	).join("");
	$("#ws-path").textContent = state.workspace || "";
	$("#nav-foot").innerHTML = `
		<button class="nav-item${pane==="members" ? " active" : ""}" data-nav="members">👤 成员</button>
		<button class="nav-item${pane==="settings" ? " active" : ""}" data-nav="settings">⚙ 工作区</button>`;
}

function paneHeader(title, meta) {
	return `<header class="detail-header">
		<div>
			<h2>${title}</h2>
			<p class="meta">${meta}</p>
		</div>
	</header>`;
}

function inboxPane() {
	const cards = state.inbox || [];
	if (!cards.length) return paneHeader("收件箱", "What needs me now?") + `<div class="empty">收件箱是空的 —— 没有停在用户工位等待你决策的任务<br><br><span class="hint">起步：终端 <code>im join &lt;你&gt; --role manager</code> → <code>im grant &lt;你&gt;</code> → 「工位」页建工位 → 「任务」页从模板建任务</span></div>`;
	return paneHeader("收件箱", "停在用户工位的任务 · 点 outcome 直接处置") + cards.map(i => {
		const terms = (i.outcomes || []).map(o => `<button class="btn small outcome" data-act="resolve" data-mission="${esc(i.mission_id)}" data-revision="${i.revision}" data-outcome="${esc(o)}">${esc(o)}${(i.terminal||[]).includes(o) ? " ✓" : ""}</button>`).join("");
		return `<article class="card">
			<h3>${esc(i.name)} <span class="chip user">用户工位 · ${esc(i.at)}</span></h3>
			<p class="objective">${esc(i.objective)}</p>
			<div class="reason"><span class="k">为何而来（提交方 reason）</span>${esc(i.reason || "(未给出)")}</div>
			<div class="card-row">
				<span class="chip">revision ${i.revision}</span>
				<span class="chip">到达 ${ago(i.arrived_at)}</span>
				<span class="chip mono">${esc(i.mission_id.slice(0,15))}…</span>
				<span class="spacer"></span>
				${terms}
				<button class="btn small" data-act="resolve" data-mission="${esc(i.mission_id)}" data-revision="${i.revision}" data-outcome="abandon" data-reason="manager 放弃（来自控制台）">abandon</button>
				<button class="btn small danger" data-act="end" data-mission="${esc(i.mission_id)}" title="manager 强制结束（disposition: deleted）">强制结束</button>
			</div>
		</article>`;
	}).join("");
}

function worksPane() {
	const works = liveWorks();
	const agents = (state.agents || []).filter(a => a.status !== "archived");
	const options = current => `<option value="-"${current ? "" : " selected"}>（用户工位）</option>` + agents.map(a => `<option value="${esc(a.id)}"${current===a.id?" selected":""}>${esc(a.id)}</option>`).join("");
	const create = `<details class="form card"><summary>＋ 新建工位</summary>
		<div class="form-grid">
			<label>key <input data-f="work" placeholder="build" size="8"></label>
			<label>名称 <input data-f="display" placeholder="构建" size="8"></label>
			<label>值守者 <select data-f="executor">${options(null)}</select></label>
			<span class="spacer"></span>
			<button class="btn primary small" data-act="work-create">创建</button>
		</div></details>`;
	if (!works.length) return paneHeader("工位", "任务流转的停驻点；不绑值守者即用户工位") + create + `<div class="empty">还没有工位<br><br><span class="hint">创建前需至少一个 manager：终端 <code>im join &lt;你&gt; --role manager</code> → <code>im grant &lt;你&gt;</code>，然后在上方展开「＋ 新建工位」</span></div>`;
	return paneHeader("工位", "任务流转的停驻点；不绑值守者即用户工位") + create + works.map(w => `<article class="card">
		<div class="card-row">
			<h3 style="margin:0">${esc(w.display_name || w.work_key)}</h3>
			<span class="chip mono">${esc(w.work_key)}</span>
			${w.executor ? `<span class="chip accent">👤 ${esc(w.executor)}</span>` : `<span class="chip user">用户工位</span>`}
			${w.holding ? `<span class="chip ok">在位任务 ${w.holding}</span>` : ""}
			<span class="spacer"></span>
			<label class="hint">换绑 <select data-act="rebind" data-work="${esc(w.work_key)}">${options(w.executor)}</select></label>
			<button class="btn small danger" data-act="work-retire" data-work="${esc(w.work_key)}">退役</button>
		</div>
		${w.prompt ? `<p class="objective" style="margin:8px 0 0">${esc(w.prompt.slice(0,160))}${w.prompt.length>160?"…":""}</p>` : ""}
	</article>`).join("");
}

function missionsPane() {
	const templates = state.templates || [];
	const create = `<details class="form card"><summary>＋ 从模板新建任务</summary>
		<div class="form-grid">
			<label>模板 <select data-f="template">${templates.map(t => `<option>${esc(t)}</option>`).join("")}</select></label>
			<label>幂等 key <input data-f="key" placeholder="v1" size="8"></label>
			<span class="spacer"></span>
			<button class="btn primary small" data-act="mission-create">创建</button>
		</div>
		<p class="hint" style="margin:4px 0 0">模板位于 <code>.im/templates/*.yaml</code>；同 key 重复创建幂等（返回已有任务）</p></details>`;
	const list = state.missions || [];
	if (!list.length) return paneHeader("任务", "自带合同与投递史的一次性邮件") + create + `<div class="empty">还没有任务<br><br><span class="hint">模板放在 <code>.im/templates/*.yaml</code>（<code>im init</code> 已写 example），在上方选模板 + 幂等 key 创建</span></div>`;
	return paneHeader("任务", "自带合同与投递史的一次性邮件") + create + list.map(m => {
		const open = expanded.has(m.mission_id);
		const evs = open ? eventsOf(m.mission_id) : [];
		return `<article class="card" style="${m.status!=="active" ? "opacity:.68" : ""}">
			<div class="card-row">
				<h3 style="margin:0">${esc(m.name || m.mission_id.slice(0,14))}</h3>
				${m.status === "active"
					? `<span class="chip accent">在 ${esc(m.at)}</span><span class="chip">revision ${m.revision}</span>`
					: `<span class="chip ok">已终结 · ${esc(m.ended_disposition || "?")}</span>`}
				<span class="chip mono">${esc(m.mission_id.slice(0,15))}…</span>
				<span class="spacer"></span>
				${m.status === "active" ? `<button class="btn small danger" data-act="end" data-mission="${esc(m.mission_id)}">强制结束</button>` : ""}
				<button class="btn small" data-act="toggle" data-mission="${esc(m.mission_id)}">${open ? "收起轨迹" : "投递轨迹"}</button>
			</div>
			${m.objective ? `<p class="objective">${esc(m.objective)}</p>` : ""}
			${open ? `<ol class="timeline">${evs.map(e => `<li class="${e.type.replace("mission.","")}"><span class="t mono">#${e.seq} ${new Date(e.created_at*1000).toLocaleTimeString("zh-CN",{hour12:false})}</span>${esc(eventSummary(e))}</li>`).join("") || `<li>（无事件）</li>`}</ol>` : ""}
		</article>`;
	}).join("");
}

function membersPane() {
	const agents = state.agents || [];
	return `<header class="detail-header"><div><h2>成员</h2><p class="meta">身份自报注册（重名自动加后缀）；manager 由人授予，删除需先退出其值守工位</p></div></header>
	<div class="card"><table>
		<thead><tr><th>身份</th><th>角色</th><th>状态</th><th>manager</th><th></th></tr></thead>
		<tbody>${agents.map(a => `<tr>
			<td class="mono">${esc(a.id)}</td>
			<td>${esc(a.role)}</td>
			<td class="hint">${esc(a.status)}</td>
			<td>${a.manager ? `<span class="chip accent">manager</span>` : ""}</td>
			<td style="text-align:right">${a.status !== "archived" ? `
				${a.manager
					? `<button class="btn small" data-act="revoke" data-agent="${esc(a.id)}">收回 manager</button>`
					: `<button class="btn small" data-act="grant" data-agent="${esc(a.id)}">设为 manager</button>`}
				<button class="btn small danger" data-act="delete-agent" data-agent="${esc(a.id)}" title="物理删除该身份（值守工位会拒绝）">删除</button>` : ""}
			</td></tr>`).join("")}</tbody>
	</table></div>`;
}

function settingsPane() {
	const ops = state.managers || [];
	return `<header class="detail-header"><div><h2>工作区</h2><p class="meta mono">${esc(state.workspace || "")}</p></div></header>
	<div class="card"><h3>概况</h3><p class="objective">
		工位 ${liveWorks().length} · 任务 ${(state.missions||[]).length} · 事件 ${(state.events||[]).length}（最近 100 条内）· 在线成员 ${(state.agents||[]).filter(a=>a.status!=="archived").length}
	</p></div>
	<div class="card"><h3>manager</h3><p class="objective">${ops.length ? ops.map(o => `<span class="chip accent mono">${esc(o)}</span>`).join(" ") : "尚未授予 —— 终端运行 im grant &lt;agent&gt;"}</p></div>
	<div class="card"><h3>任务模板</h3><p class="objective">${(state.templates||[]).map(t => `<span class="chip mono">${esc(t)}</span>`).join(" ") || "无"}</p>
	<p class="hint">控制台是临时进程：仅绑 127.0.0.1，闲置 300 秒自动退出；每 2 秒轮询。</p></div>`;
}

function render() {
	renderSidebar();
	const main = $("#main");
	main.innerHTML = pane === "inbox" ? inboxPane()
		: pane === "works" ? worksPane()
		: pane === "missions" ? missionsPane()
		: pane === "members" ? membersPane()
		: settingsPane();
}

/* ---------------- events ---------------- */
function field(name) { const el = $(`[data-f="${name}"]`); return el ? el.value.trim() : ""; }

document.addEventListener("click", async e => {
	const nav = e.target.closest("[data-nav]");
	if (nav) { pane = nav.dataset.nav; render(); return; }
	const btn = e.target.closest("[data-act]");
	if (!btn) return;
	const d = btn.dataset;
	switch (d.act) {
		case "resolve": await act({ type: "mission_submit", mission: d.mission, revision: Number(d.revision), outcome: d.outcome, reason: d.reason }); break;
		case "end": { const reason = prompt("结束原因（将记录为 deleted）："); if (reason !== null) await act({ type: "mission_end", mission: d.mission, reason }); break; }
		case "grant": await act({ type: "grant", agent: d.agent }); break;
		case "revoke": await act({ type: "revoke", agent: d.agent }); break;
		case "delete-agent": if (confirm(`删除成员 ${d.agent}？物理删除、不可恢复（其消息历史保留为文本）。`)) await act({ type: "delete_agent", agent: d.agent }); break;
		case "work-create": {
			const work = field("work");
			if (!work) { toast("工位 key 必填", false); break; }
			await act({ type: "work_create", work, display_name: field("display"), executor: field("executor") || "-", prompt: "" });
			break;
		}
		case "work-retire": if (confirm(`退役工位 ${d.work}？（在位任务会阻止退役）`)) await act({ type: "work_retire", work: d.work }); break;
		case "mission-create": {
			const key = field("key");
			if (!key) { toast("幂等 key 必填", false); break; }
			await act({ type: "mission_create", template: field("template"), key });
			break;
		}
		case "toggle": expanded.has(d.mission) ? expanded.delete(d.mission) : expanded.add(d.mission); render(); break;
	}
});

document.addEventListener("change", async e => {
	const s = e.target.closest('select[data-act="rebind"]');
	if (!s) return;
	await act({ type: "set_executor", work: s.dataset.work, executor: s.value });
});

/* ---------------- polling ---------------- */
async function refresh(force) {
	try {
		const res = await fetch("/api/state");
		const raw = await res.text();
		if (!force && raw === lastRaw) return;
		// Don't clobber a form the user is typing into.
		const focus = document.activeElement;
		if (!force && focus && $("#main").contains(focus) && ["INPUT","SELECT"].includes(focus.tagName)) { lastRaw = raw; return; }
		lastRaw = raw;
		state = JSON.parse(raw);
		render();
	} catch { /* server exiting or transient */ }
}
refresh(true);
setInterval(refresh, 2000);
</script>
