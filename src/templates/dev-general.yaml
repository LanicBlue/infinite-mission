# 通用功能交付线(v4)。
# 裁决要点:spec=设计意图档案;主管把 spec 编译成详细 plan.md(ACn 判据全文内联)并
# 保障 plan 与 spec 相符;实施/验证/审查的判据一律以 plan 为准(build/verify 无 spec
# 读权,review-audit 留 spec 作意图参考);build 只回 supervisor(spec-gap 是主管的判断);
# verify=主 mission 必跑站(不经 ask),UI 验证在 ui/mixed 模板里串行跟在 verify 后;
# evidence 漏报由主管退回验证站补(reject-evidence·ui/mixed 另有 -ui 变体),不绕道实现岗;
# 测试完整性/退役=review-impl 职责。唯一 ask 并行点:审查环三方向只读审查(--from review-audit)。
schemaVersion: 4
name: dev-general
objective: "通用功能交付:设计冻结 spec → 主管方案审查+编制 plan → 实现 → 审查环 → 必跑验证 → 主管证据复核 → 设计终验"

entry: design

works:
  design:
    completion:
      outcomes: [spec-ready, accept, reject-quality]
      terminal: [accept]
      feedbackRequiredOn: [reject-quality]
    documentRights: {read: [spec, plan, impl, review, audit, evidence, residuals], write: [spec]}
  supervisor:
    completion:
      outcomes: [spec-reject, plan-ready, reject-impl, reject-evidence, quality-passed]
      terminal: []
      feedbackRequiredOn: [spec-reject, reject-impl, reject-evidence]
    documentRights: {read: [spec, plan, impl, review, audit, evidence, residuals], write: [plan, residuals]}
  build:
    completion: {outcomes: [impl-ready, plan-reject], terminal: [], feedbackRequiredOn: [plan-reject]}
    documentRights: {read: [plan, audit], write: [impl]}
  review-audit:
    completion: {outcomes: [reject-impl, approved], terminal: [], feedbackRequiredOn: [reject-impl]}
    documentRights: {read: [spec, plan, impl], write: [review, audit]}
  verify:
    completion: {outcomes: [verify-passed, verify-failed], terminal: [], feedbackRequiredOn: [verify-failed]}
    documentRights: {read: [plan, impl, review, audit], write: [evidence]}

documents:
  - {id: spec,     kind: file, path: spec.md}
  - {id: plan,     kind: file, path: plan.md}
  - {id: impl,     kind: file, path: impl.md}
  - {id: review,   kind: file, path: review.md}
  - {id: audit,    kind: file, path: audit.md}
  - {id: evidence, kind: file, path: evidence.md}
  - {id: residuals, kind: file, path: residuals.md}

paths:
  - {from: design,       when: spec-ready,      to: supervisor}
  - {from: design,       when: reject-quality,  to: supervisor,  iterationPolicy: increment}
  - {from: supervisor,   when: spec-reject,     to: design,      iterationPolicy: increment}
  - {from: supervisor,   when: plan-ready,      to: build}
  - {from: supervisor,   when: reject-impl,     to: build,       iterationPolicy: increment}
  - {from: supervisor,   when: reject-evidence, to: verify,      iterationPolicy: increment}
  - {from: supervisor,   when: quality-passed,  to: design,      iterationPolicy: increment}
  - {from: build,        when: impl-ready,      to: review-audit, iterationPolicy: increment}
  - {from: build,        when: plan-reject,   to: supervisor,  iterationPolicy: increment}
  - {from: review-audit, when: reject-impl,     to: build,       iterationPolicy: increment}
  - {from: review-audit, when: approved,        to: verify}
  - {from: verify,       when: verify-passed,   to: supervisor,  iterationPolicy: increment}
  - {from: verify,       when: verify-failed,   to: supervisor,  iterationPolicy: increment}
