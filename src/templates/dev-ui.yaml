# UI 功能交付线(v4):实现段 build-ui;验证段 verify→verify-ui 串行;其余同 dev-general。
schemaVersion: 4
name: dev-ui
objective: "UI 功能交付:设计冻结 spec → 主管方案审查+plan → UI 实现 → 审查环 → 必跑验证(verify→verify-ui)→ 主管证据复核 → 设计终验"

entry: design

works:
  design:
    completion:
      outcomes: [spec-ready, accept, reject-quality]
      terminal: [accept]
      feedbackRequiredOn: [reject-quality]
    documentRights: {read: [spec, plan, impl-ui, review, audit, evidence, evidence-ui, residuals], write: [spec]}
  supervisor:
    completion:
      outcomes: [spec-reject, plan-ready, reject-impl, quality-passed]
      terminal: []
      feedbackRequiredOn: [spec-reject, reject-impl]
    documentRights: {read: [spec, plan, impl-ui, review, audit, evidence, evidence-ui, residuals], write: [plan, residuals]}
  build-ui:
    completion: {outcomes: [ui-ready, plan-reject], terminal: [], feedbackRequiredOn: [plan-reject]}
    documentRights: {read: [plan, audit], write: [impl-ui]}
  review-audit:
    completion: {outcomes: [reject-impl, approved], terminal: [], feedbackRequiredOn: [reject-impl]}
    documentRights: {read: [spec, plan, impl-ui], write: [review, audit]}
  verify:
    completion: {outcomes: [verify-passed, verify-failed], terminal: [], feedbackRequiredOn: [verify-failed]}
    documentRights: {read: [plan, impl-ui, review, audit], write: [evidence]}
  verify-ui:
    completion: {outcomes: [ui-verified, ui-failed], terminal: [], feedbackRequiredOn: [ui-failed]}
    documentRights: {read: [plan, impl-ui, review, audit, evidence], write: [evidence-ui]}

documents:
  - {id: spec,     kind: file, path: spec.md}
  - {id: plan,     kind: file, path: plan.md}
  - {id: impl-ui,  kind: file, path: impl-ui.md}
  - {id: review,   kind: file, path: review.md}
  - {id: audit,    kind: file, path: audit.md}
  - {id: evidence, kind: file, path: evidence.md}
  - {id: evidence-ui, kind: file, path: evidence-ui.md}
  - {id: residuals, kind: file, path: residuals.md}

paths:
  - {from: design,       when: spec-ready,      to: supervisor}
  - {from: design,       when: reject-quality,  to: supervisor,  iterationPolicy: increment}
  - {from: supervisor,   when: spec-reject,     to: design,      iterationPolicy: increment}
  - {from: supervisor,   when: plan-ready,      to: build-ui}
  - {from: supervisor,   when: reject-impl,     to: build-ui,    iterationPolicy: increment}
  - {from: supervisor,   when: quality-passed,  to: design,      iterationPolicy: increment}
  - {from: build-ui,     when: ui-ready,        to: review-audit, iterationPolicy: increment}
  - {from: build-ui,     when: plan-reject,   to: supervisor,  iterationPolicy: increment}
  - {from: review-audit, when: reject-impl,     to: build-ui,    iterationPolicy: increment}
  - {from: review-audit, when: approved,        to: verify}
  - {from: verify,       when: verify-passed,   to: verify-ui}
  - {from: verify,       when: verify-failed,   to: supervisor,  iterationPolicy: increment}
  - {from: verify-ui,    when: ui-verified,     to: supervisor,  iterationPolicy: increment}
  - {from: verify-ui,    when: ui-failed,       to: supervisor,  iterationPolicy: increment}
